apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: go-simple-webserver
  labels:
    app: go-simple-webserver
spec:
  replicas: 10
  strategy:
    canary:
      steps:
        - setWeight: 50
        - pause: { duration: 60s }
        - setWeight: 100
  selector:
    matchLabels:
      app: go-simple-webserver
  template:
    metadata:
      labels:
        app: go-simple-webserver
    spec:
      containers:
        - name: webserver
          image: ghcr.io/danutaldea/ci_cd_lab@sha256:254d8fafedacdefbd6ec69e2a71ecfba90a79c178db968ce30f2dd15792ef2b9
          ports:
            - containerPort: 8080
          imagePullPolicy: Always
